services:
  - type: web
    name: rtsa-itms-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    # Free tier has no pre-deploy hook, so migrations + seed run at web startup.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      # Fernet key for encryption at rest (MFA secrets). Generate once:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: ENCRYPTION_KEY
        sync: false
      # Password for the seeded admin account (otherwise the public demo default is used).
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

  - type: worker
    name: rtsa-itms-notification-worker
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.notification_worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Optional delivery providers; without them SMS/email are logged only (sandbox).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMS_WEBHOOK_URL
        sync: false
      - key: SMS_WEBHOOK_TOKEN
        sync: false