services:
  - type: web
    name: rtsa-itms-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    # Free tier has no pre-deploy hook, so migrations + seed run at web startup.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false

  - type: worker
    name: rtsa-itms-notification-worker
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.notification_worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false