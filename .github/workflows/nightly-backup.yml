name: Nightly database backup

# Takes a backup of the production database and copies it, encrypted, to
# S3-compatible storage. Runs here rather than on Render because Render's disk
# is wiped on deploy and its free plan doesn't run background workers.
# Set these repository secrets (Settings > Secrets and variables > Actions):
#   BACKUP_DATABASE_URL, BACKUP_S3_ENDPOINT, BACKUP_S3_REGION, BACKUP_S3_BUCKET,
#   BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY, BACKUP_ENCRYPTION_KEY
# Until they're set, the job skips itself. See docs/DISASTER_RECOVERY.md.

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC = 02:30 in Zambia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_S3_BUCKET" ]; then
            echo "Backup secrets are not set yet - skipping. See docs/DISASTER_RECOVERY.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            # This repository is public; never ship personal data off-site unencrypted from here.
            echo "::error::BACKUP_ENCRYPTION_KEY is not set - refusing to upload an unencrypted backup."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.cfg.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # --json: the runner's pg_dump may be older than the database server, which
      # pg_dump refuses; the portable JSON snapshot has no such constraint.
      - name: Back up and copy off-site
        if: steps.cfg.outputs.skip != 'true'
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
          RUN_MIGRATIONS_ON_STARTUP: "false"
        run: python -m scripts.backup --json
