name: Ping URL

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes
  workflow_dispatch:       # Allows manual runs

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping URL
        run: curl --fail --silent --show-error --max-time 30 https://rtsa-itms-api.onrender.com/health